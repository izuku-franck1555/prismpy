[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismpy"
version = "0.1.0"
description = "A unified data-to-model translation framework for spatial crop modeling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Crop Modeling Research Team"}
]
keywords = [
    "crop modeling",
    "spatial simulation",
    "DSSAT",
    "AquaCrop",
    "SARRA-H",
    "data translation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    # Sprint E.0.5 AC-Q2-A1-d — three core scientific deps gain
    # major-version upper bounds for byte-identical bound-gen
    # determinism (paired with the AC-Q2-B1 thread-pin set). The
    # floors are preserved; only the upper bounds are new.
    "numpy>=1.24,<2.0",
    "pandas>=2.0.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "fiona>=1.9.0",
    "rasterio>=1.3,<2.0",
    "netCDF4>=1.6.0",
    "xarray>=2023.1,<2025.0",
    "requests>=2.31.0",
    "filelock>=3.12.0",
    "tqdm>=4.65.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
agera5 = [
    "cdsapi>=0.6.0",
]
viz = [
    "matplotlib>=3.7.0",
]
all = [
    "prismpy[dev,agera5,viz]",
]

[project.scripts]
prismpy = "prismpy.cli:main"

[project.urls]
Homepage = "https://github.com/izuku-franck1555/prismpy"
Documentation = "https://prismpy.readthedocs.io"
Repository = "https://github.com/izuku-franck1555/prismpy"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prismpy*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
