[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismpy"
version = "0.1.0"
description = "A unified data-to-model translation framework for spatial crop modeling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Crop Modeling Research Team"}
]
keywords = [
    "crop modeling",
    "spatial simulation",
    "DSSAT",
    "AquaCrop",
    "SARRA-H",
    "data translation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    # Sprint E.0.5 AC-Q2-A1-d — three core scientific deps gain
    # major-version upper bounds for byte-identical bound-gen
    # determinism (paired with the AC-Q2-B1 thread-pin set). The
    # floors are preserved; only the upper bounds are new.
    "numpy>=1.24,<2.0",
    # pandas 3.0 wheels are built against the numpy 2.x ABI; resolving an
    # unbounded ``pandas>=2.0.0`` against the ``numpy<2.0`` cap above pulls
    # in pandas 3.0.x on numpy 1.26 → a binary ABI mismatch ("numpy.ndarray
    # size changed, Expected 16 ... got 96") that destabilises the shared
    # netCDF4/HDF5 C state and SIGSEGVs the bound-gen test job. Cap pandas to
    # the numpy-1.x-compatible 2.x line, atomic with the numpy<2.0 pin.
    "pandas>=2.0.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "fiona>=1.9.0",
    "rasterio>=1.3,<2.0",
    "netCDF4>=1.6.0",
    "xarray>=2023.1,<2025.0",
    # rioxarray registers the ``.rio`` accessor on xarray DataArrays
    # via import side-effect; the TAMSAT Phase 2 ``.nc → .tif`` step
    # consumes the accessor (``ds.rio.to_raster(...)``) and a missing
    # rioxarray surfaces as a fail-loud ``ModuleNotFoundError`` that
    # the climate retrieve broad-except path captures and reports as
    # a TAMSAT download failure. Declaring it here keeps fresh venv
    # installs from inheriting the silent-swallow path. The upper
    # bound caps below the rioxarray 0.20 cutover that requires
    # ``numpy>=2`` (incompatible with the existing
    # ``numpy>=1.24,<2.0`` pin) so a free upgrade cannot silently
    # break the byte-identical bound-gen substrate that paired
    # numpy + rasterio + xarray locked in Sprint E.0.5.
    "rioxarray>=0.15,<0.20",
    "requests>=2.31.0",
    "filelock>=3.12.0",
    "tqdm>=4.65.0",
    "python-dateutil>=2.8.0",
    # cdsapi was previously declared in [project.optional-dependencies]
    # under the ``agera5`` extras-group; promoted to a required dep so
    # SARRA-Py installs cannot drift into a state where AgERA5
    # retrieve silently skips on a fresh venv (the exact failure mode
    # that surfaced when the prismweb dev venv lost cdsapi during a
    # routine refresh between 2026-05-02 and 2026-05-05). The
    # ``~/.cdsapirc`` runtime credential remains a runtime concern;
    # only declaring the import-time dep is a configuration concern.
    "cdsapi>=0.6.0",
    # pygadm provides the GADM administrative-boundary download
    # fallback that the executor invokes when a region's local GADM
    # shapefile cannot load (executor.py invokes ``pygadm.Names`` /
    # ``pygadm.Items`` to resolve country + admin level). Previously
    # undeclared — present in the dev OUTER venv via an editable
    # install but missing from the CI-isolated venv that surfaced
    # the silent-skip class. Declaring it required keeps fresh
    # installs from inheriting the silent-fallback path.
    "pygadm>=0.5,<1.0",
    # pyodbc is the platform-portable Microsoft Access ODBC driver
    # the ACEA HWSD path uses to read ``.mdb`` files when the
    # preferred ``mdbtools`` system package is absent. Promoted to a
    # required dep (was previously gated by an opt-in extras-group)
    # so a ``pip install prismpy`` on a fresh venv never silently
    # skips the ACEA fallback. The Python wheel install is universal;
    # the corresponding system package (``brew install unixodbc`` on
    # macOS, ``apt-get install -y unixodbc-dev`` on Linux) is
    # documented in prismweb's ``DEPLOY.md`` pre-launch checklist
    # and pinned in the production Dockerfile so prod deploys carry
    # both halves.
    "pyodbc>=5.0,<6.0",
    # isimip-client wraps the public ISIMIP3b data API used by the
    # climate-scenario-package generator (paired baseline + projection
    # WTH/pickle/GeoTIFF outputs). No API key is required for read
    # access. Public release: https://github.com/ISI-MIP/isimip-client
    # The 2.x line is the current canonical API; the upper bound caps
    # below 3.0 so a future major-version refactor surfaces at sprint
    # time rather than as a silent contract drift in cached_cutout
    # parameters or dataset-version metadata. Promoting from optional
    # to required keeps fresh installs from silently skipping the
    # scenario-package code path the way agera5/cdsapi did before
    # being promoted.
    "isimip-client>=2.0,<3.0",
    # NotRequired moved into typing at 3.11; the errors package needs
    # typing_extensions on 3.10 (prismpy supports >=3.10,<3.13).
    "typing_extensions ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    # Sprint G structural tests for the ISIMIP3b client substrate use
    # the ``responses`` library to mock HTTP cutout responses without
    # touching the live API. Locally installed transitively in some
    # dev envs but not declared by manifest, so CI couldn't find it.
    "responses>=0.26.0",
]
viz = [
    "matplotlib>=3.7.0",
]
all = [
    "prismpy[dev,viz]",
]

[project.scripts]
prismpy = "prismpy.cli:main"

[project.urls]
Homepage = "https://github.com/izuku-franck1555/prismpy"
Documentation = "https://prismpy.readthedocs.io"
Repository = "https://github.com/izuku-franck1555/prismpy"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prismpy*"]

[tool.setuptools.package-data]
# Bundle non-Python data files into installed wheels. The
# ``prismpy.koppen`` package ships ``ecocrop_envelopes.json``
# (loader default-path), the Beck 2023 1km raster
# ``data/beck_2023_v1.tif``, and its legend
# ``data/beck_2023_v1_legend.txt``. Without these patterns
# setuptools omits non-Python files from the wheel and
# loader / classifier default-path resolution raises
# FileNotFoundError on a pip-installed prismpy.
"prismpy.koppen" = [
    "*.json",
    "data/*.json",
    "data/*.tif",
    "data/*.txt",
]
# The vendored ``SARRA_data_download`` library ships under
# ``prismpy/src/prismpy/vendor/sarra_data_download/`` with the
# upstream MIT LICENSE preserved verbatim alongside the source.
# Without this glob the LICENSE drops out of the wheel and the
# attribution record gets lost on a pip-installed prismpy. Per
# durable lesson #22 (wheel-contents pin discipline), the
# structural test ``test_climate_source_imports_declared.py``
# verifies the vendored files exist on disk; this glob keeps
# them inside the wheel artifact.
"prismpy.vendor.sarra_data_download" = [
    "LICENSE",
]
# The vendored ``hwsd_extraction`` helper ships under
# ``prismpy/src/prismpy/vendor/hwsd_extraction/`` with a project-
# authored open-access non-commercial LICENSE (the ACEA Data-to-
# Model Translation Framework is the project's own toolkit). The
# Python source is picked up by the ``include = ["prismpy*"]``
# package finder automatically; this glob keeps the LICENSE inside
# the wheel artifact alongside the source so the attribution record
# does not drop out of pip-installed prismpy.
"prismpy.vendor.hwsd_extraction" = [
    "LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -m 'not slow'"
markers = [
    "slow: tests requiring real CDS credentials and long wall-clock (~20-40 min). Excluded from FAST tier by the default `addopts` filter; run on-demand or nightly via `pytest -m slow`.",
]
