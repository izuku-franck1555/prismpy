# UC2 credible baseline — Kano-belt COWPEA, NASA POWER observed 2000-2020,
# 40-cell ISIMIP3b-aligned 0.5° grid. The SITE grid is set via
# region.grid_resolution: "30arcmin" (NOT the pythia raster knob) + the
# cell-center bbox, so the projection clone-and-swap maps 1:1 to the 40
# ISIMIP cells. Baseline climate = NASA POWER (specialist-approved; pythia's
# observed source). Disclosure rider (product-mismatch caveat) baked at Bar-2.
project:
  name: "uc2_kano_sorghum_baseline"
  description: "UC2 credible baseline — Kano sorghum, NASA POWER 2000-2020, 40-cell 0.5deg"
  version: "1.0"

region:
  name: "Kano"
  country: "Nigeria"
  country_iso3: "NGA"
  grid_resolution: "30arcmin"
  boundary:
    source: "manual"
    manual_bounds:
      minx: 5.75
      miny: 11.25
      maxx: 10.25
      maxy: 12.75

crop:
  name: "Sorghum"
  name_short: "sgh"
  variety: "sudan_short"
  calendar:
    planting_doy: 166
    maturity_doy: 270

management:
  planting_density: 60000.0
  sowing_mode: "fixed_date"
  irrigation: false

soil_config:
  source: "eghr"
  default_depth_m: 1.5

temporal:
  start_year: 2000
  end_year: 2020
  spinup_years: 0

targets:
  - pythia

platform_config:
  pythia:
    enabled: true
    grid_resolution: 0.5
    climate_source: nasa_power
    soil_source: eghr
    dssat_version: "4.8"
    eghr_raster_path: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/PYTHIA/Simulation_Data/raster/ggcmi_soils_2.tif"
    eghr_database_path: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/PYTHIA/Simulation_Data/eGHR/GHR.db"
    eghr_sol_dir: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/PYTHIA/Simulation_Data/eGHR/"
    weather_download_delay: 1.0
    spam_raster_dir: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/data/spam/"
    spam_version: "2020"

data_sources:
  climate:
    source: "nasa_power"
  soil:
    source: "eghr"
  cache_enabled: true
  cache_dir: "data/cache/"

output:
  base_dir: "output/uc2_kano_sorghum_baseline/"
  structure: "by_platform"

provenance:
  enabled: true
  storage: "json"
