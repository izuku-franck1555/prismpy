# Maize variety parameters for West Africa
# Based on SARRA-Py Cameroon OPV calibration (MaisOPV_MLIV42)
# Source: SyntheseCalibrationVarietes_04_2020

# Phenology (thermal time in degree-days)
SDJLevee: 90.0       # Emergence
SDJBVP: 500.0        # Basic vegetative phase
SDJRPR: 400.0        # Reproductive phase
SDJMatu1: 500.0      # Grain filling 1 (key for yield)
SDJMatu2: 200.0      # Grain filling 2

# Yield potential coefficients
KRdtPotA: 0.4        # Harvest index parameter A
KRdtPotB: 200.0      # Harvest index parameter B

# Photoperiod sensitivity
PPExp: 0.0           # Photoperiod exponent
SeuilPP: 13.6        # Critical day length threshold (hours)
PPsens: 5.0          # Photoperiod sensitivity coefficient
PPCrit: 11.0         # Critical photoperiod

# Temperature thresholds
TBase: 8.0           # Base temperature (°C)
TOpt1: 26.0          # Lower optimal temperature (°C)
TOpt2: 34.0          # Upper optimal temperature (°C)
TLim: 44.0           # Lethal temperature (°C)

# Biomass allocation and conversion
pcReallocFeuille: 0.7
txConversion: 5.8    # Radiation use efficiency (g/MJ)
txAssimBVP: 1.0
txAssimMatu1: 0.9
txAssimMatu2: 0.1
kRespMaint: 0.01

# Aerial biomass partitioning
aeroTotBase: 0.6
aeroTotPente: 3.5e-05
feuilAeroBase: 0.60
feuilAeroPente: -1.4e-04
txRealloc: 0.4

# Other parameters
tempMaint: 25.0
kcMax: 1.25
PFactor: 0.45
seuilCstrMortality: 3.0
kdf: 0.4
txResGrain: 0.55

# Root growth rates (mm/day per degree-day)
VRacLevee: 30.0
VRacBVP: 15.0
VRacPSP: 15.0
VRacRPR: 15.0
VRacMatu1: 12.0
VRacMatu2: 12.0

# Specific leaf area (m2/g)
slaMin: 0.002
slaMax: 0.006
slaPente: 0.4

# Density response
densiteA: 0.7
densiteP: 4.5

# Supplementary parameters
densOpti: 65000.0
AGauss: 1.0
KRdtBiom: 0.0
LGauss: 1.0
NIYo: 1.0
NIp: 0.0
phaseDevVeg: 0
poidsSecGrain: 0.38
senCO2: 10.0
