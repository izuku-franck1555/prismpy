# Pearl millet variety parameters for West Africa
# Based on SARRA-Py Niger calibration (MilHK_NERV41)
# Suitable for Sahel and Sudan-Sahel zones

# Phenology (thermal time in degree-days)
SDJLevee: 70.0       # Emergence
SDJBVP: 700.0        # Basic vegetative phase
SDJRPR: 400.0        # Reproductive phase
SDJMatu1: 300.0      # Grain filling 1
SDJMatu2: 150.0      # Grain filling 2

# Yield potential coefficients
KRdtPotA: 0.5        # Harvest index parameter A
KRdtPotB: 100.0      # Harvest index parameter B

# Photoperiod sensitivity (millet is photoperiod sensitive)
PPExp: 0.12          # Photoperiod exponent
SeuilPP: 13.6        # Critical day length threshold (hours)
PPsens: 0.66         # Photoperiod sensitivity coefficient
PPCrit: 11.0         # Critical photoperiod

# Temperature thresholds
TBase: 11.0          # Base temperature (°C)
TOpt1: 32.0          # Lower optimal temperature (°C)
TOpt2: 36.0          # Upper optimal temperature (°C)
TLim: 46.0           # Lethal temperature (°C)

# Biomass allocation and conversion
pcReallocFeuille: 0.6
txConversion: 5.0    # Radiation use efficiency (g/MJ)
txAssimBVP: 1.0
txAssimMatu1: 0.9
txAssimMatu2: 0.7
kRespMaint: 0.01

# Aerial biomass partitioning
aeroTotBase: 0.6
aeroTotPente: 5.0e-05
feuilAeroBase: 0.65
feuilAeroPente: -0.0002
txRealloc: 0.4

# Other parameters
tempMaint: 25.0
kcMax: 1.15
PFactor: 0.55
seuilCstrMortality: 3.0
kdf: 0.4
txResGrain: 0.5

# Root growth rates (mm/day per degree-day)
VRacLevee: 35.0
VRacBVP: 35.0
VRacPSP: 35.0
VRacRPR: 35.0
VRacMatu1: 25.0
VRacMatu2: 25.0

# Specific leaf area (m2/g)
slaMin: 0.0016
slaMax: 0.008
slaPente: 0.4

# Density response
densiteA: 0.7
densiteP: 4.5

# Supplementary parameters
densOpti: 53333.0
AGauss: 1.0
KRdtBiom: 0.0
LGauss: 1.0
NIYo: 1.0
NIp: 0.0
phaseDevVeg: 0
poidsSecGrain: 0.028
senCO2: 10.0
