# prismpy ACEA Test Configuration - Ethiopia Maize
# Tests self-contained package with Maize (ACEA FAO code 56)
#
# Region: Oromia, Ethiopia
# Crop: Maize
# Platform: ACEA (AquaCrop)

# Project information
project:
  name: "Ethiopia_Maize_Test"
  description: "Test ACEA self-contained package with Ethiopia/Maize"
  version: "1.0"

# Region configuration - Oromia, Ethiopia
region:
  name: "Oromia"
  country: "Ethiopia"
  country_iso3: "ETH"
  boundary:
    source: "manual"
    manual_bounds:
      minx: 38.0
      miny: 7.0
      maxx: 40.0
      maxy: 9.0

# Crop configuration - Maize
crop:
  name: "Maize"
  name_short: "mze"
  variety: "ethiopia_highland"

  calendar:
    planting_doy: 135   # Mid-May (Belg/Kiremt transition)
    maturity_doy: 270   # Late September

  # Maize-specific phenology in thermal time (GDD)
  phenology:
    emergence_gdd: 90.0
    vegetative_phase_gdd: 600.0
    reproductive_phase_gdd: 400.0
    grain_filling_gdd: 500.0
    photoperiod_sensitivity: 0.0

  # Maize physiology parameters
  physiology:
    base_temperature: 8.0
    optimal_temperature: 30.0
    max_temperature: 40.0
    radiation_use_efficiency: 3.8
    harvest_index: 0.48

# Management parameters
management:
  planting_density: 60000.0  # plants/ha
  sowing_mode: "fixed_date"
  irrigation: false

# Soil configuration
soil_config:
  source: "hwsd"
  default_depth_m: 2.0

# Temporal scope
temporal:
  start_year: 2018
  end_year: 2020
  spinup_years: 2

# Target platforms
targets:
  - acea

# Platform-specific configuration
platform_config:
  acea:
    enabled: true
    resolution: "5arcmin"
    climate_source: nasa_power
    soil_source: hwsd
    compute_et0: true
    # Self-contained package settings
    download_climate: true
    climate_download_delay: 2.0

    # HWSD soil data paths (for self-contained packages)
    hwsd_bil_path: "/path/to/HWSD2_RASTER/HWSD2.bil"
    hwsd_mdb_path: "/path/to/HWSD2.mdb"
    include_soil_in_package: true

    # SPAM harvested area data
    include_spam_in_package: true

    # GAEZ crop suitability data (auto-download from FAO)
    gaez_auto_download: true
    include_gaez_in_package: true

# Data sources
data_sources:
  climate:
    source: "nasa_power"
  soil:
    source: "hwsd"
  cache_enabled: true

# Output configuration
output:
  base_dir: "output/ethiopia_maize_test/"
  structure: "by_platform"

# Provenance tracking
provenance:
  enabled: true
  storage: "json"
