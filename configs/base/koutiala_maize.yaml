# ICASA-Compliant Base Configuration - Koutiala Maize
# Region: Koutiala, Mali (Sudanian climate zone)
# Crop: Maize (improved OPV)
#
# This file contains platform-agnostic agronomic data following ICASA standards.
# Use with a platform DOME (configs/domes/) for translation.
#
# References:
# - ICASA v2.0: White et al. (2013)
# - DOME concept: Porter et al. (2014)

_meta:
  format: "icasa_ace"
  version: "2.0"
  description: "ICASA-compliant base config for Koutiala maize simulations"

# =============================================================================
# Project Information
# =============================================================================
project:
  name: "Koutiala_Maize"
  description: "Maize simulation for Koutiala, Mali - Sudanian climate zone"
  version: "1.0"

# =============================================================================
# Region Configuration (ICASA Location Fields)
# =============================================================================
region:
  name: "Koutiala"
  country: "Mali"
  country_iso3: "MLI"

  # ICASA location fields
  FL_LAT: 12.4            # Field latitude (decimal degrees)
  FL_LONG: -5.6           # Field longitude (decimal degrees)
  FLELE: 350              # Elevation (m)

  # Boundary specification
  boundary:
    source: "gadm"
    gadm_level: 2
    gadm_filter_field: "NAME_2"
    gadm_filter_value: "Koutiala"

# =============================================================================
# Crop Configuration (ICASA Crop Fields)
# =============================================================================
crop:
  # Crop identification
  CRID: "MZ"              # ICASA crop code (Maize)
  name: "Maize"           # Human-readable name
  name_short: "MZ"        # REQUIRED: Short crop code for filenames
  GENO_NAME: "OBATANPA"   # Genotype/cultivar name
  variety: "OBATANPA"     # Use actual cultivar name

  # Crop calendar (ICASA timing)
  calendar:
    PDATE: 155            # ICASA: Planting DOY (June 4)
    planting_doy: 155     # Alias
    maturity_doy: 280
    harvest_doy: 280
    source: "literature"
    reference: "MacCarthy et al. (2017); Adnan et al. (2019)"

  # =============================================================================
  # Phenology (Thermal Time) - ICASA codes + human-readable aliases
  # =============================================================================
  phenology:
    # ICASA codes
    P1: 280.0             # GDD from sowing to end juvenile phase
    P2: 0.0               # Photoperiod sensitivity coefficient
    P5: 750.0             # GDD from silking to physiological maturity
    PHINT: 45.0           # Phyllochron interval (GDD between leaf tips)

    # Human-readable aliases (same values)
    emergence_gdd: 280.0
    photoperiod_sensitivity: 0.0
    grain_filling_gdd: 750.0

    # Additional phases (for SARRA-Py compatibility)
    vegetative_phase_gdd: 350.0
    reproductive_phase_gdd: 350.0

  # =============================================================================
  # Physiology - ICASA codes + human-readable aliases
  # =============================================================================
  physiology:
    # ICASA codes
    TB: 8.0               # Base temperature for development (C)
    TO: 30.0              # Optimal temperature for growth (C)
    TM: 42.0              # Maximum temperature (C)
    RUEF: 3.5             # Radiation use efficiency (g/MJ PAR)
    HI: 0.50              # Harvest index (grain/total biomass)

    # Human-readable aliases
    base_temperature: 8.0
    optimal_temperature: 30.0
    max_temperature: 42.0
    radiation_use_efficiency: 3.5
    harvest_index: 0.50

# =============================================================================
# Management Configuration (ICASA Management Fields)
# =============================================================================
management:
  # Planting (ICASA codes)
  PPOP: 5.5               # Plant population (plants/m2)
  PLRS: 75                # Row spacing (cm)
  PLDP: 5                 # Planting depth (cm)
  PLME: "S"               # Planting method: S=seed, T=transplant
  PLDS: "R"               # Plant distribution: R=rows, B=broadcast

  # Human-readable aliases
  planting_density: 55000       # plants/ha (= PPOP * 10000)
  row_spacing_cm: 75
  sowing_mode: "fixed_date"
  irrigation: false

  # Fertilizer splits (must be here for ManagementConfig; source values in fertilizer: section)
  # Source: MacCarthy et al. (2017) — 60 kg N/ha, 25% at 10 DAE + 75% at 36 DAE
  fertilizer_n_total: 60.0
  fertilizer_n_splits: [10, 36]
  fertilizer_n_fractions: [0.25, 0.75]

# =============================================================================
# Fertilizer Configuration (ICASA Fertilizer Fields)
# =============================================================================
fertilizer:
  # Total amounts (ICASA codes)
  FEAMN: 60.0             # Total nitrogen applied (kg N/ha)
  FEAMP: 10.0             # Total P2O5 applied (kg/ha)
  FEAMK: 10.0             # Total K2O applied (kg/ha)

  # Human-readable aliases
  fertilizer_n_total: 60.0
  fertilizer_p_total: 10.0
  fertilizer_k_total: 10.0

  # Application splits (platform-agnostic)
  splits:
    - dap: 10             # Days after planting
      n_fraction: 0.25    # 25% of N
      p_applied: true     # All P in first application
      k_applied: true     # All K in first application
    - dap: 36
      n_fraction: 0.75    # 75% of N

# =============================================================================
# Soil Configuration (Generic)
# =============================================================================
soil:
  SLDP: 150               # ICASA: Soil profile depth (cm)
  default_depth_m: 1.5    # Alias in meters

soil_config:
  source: "isda"          # Default soil source
  default_depth_m: 1.5

# =============================================================================
# Temporal Configuration
# =============================================================================
temporal:
  start_year: 2015
  end_year: 2023
  spinup_years: 2

# =============================================================================
# Target Platforms (for legacy compatibility)
# =============================================================================
targets:
  - craft

# =============================================================================
# Output Configuration
# =============================================================================
output:
  base_dir: "output/koutiala/"
  structure: "by_platform"

# =============================================================================
# Provenance
# =============================================================================
provenance:
  enabled: true
  storage: "json"
