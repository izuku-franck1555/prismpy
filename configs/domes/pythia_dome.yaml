# Pythia Platform DOME (Data Overlay for Multi-model Export)
# Platform: Pythia (DSSAT-based global yield forecasting)
#
# DESIGN PRINCIPLE: This DOME contains ALL platform-specific settings explicitly.
#
# Usage: prismpy translate --base configs/base/X.yaml --dome configs/domes/pythia_dome.yaml

dome_type: "platform_overlay"
platform: "pythia"
description: "Pythia (DSSAT-based global yield forecasting) - Complete platform configuration"

# =============================================================================
# PLATFORM CONFIG (Complete - matches legacy format exactly)
# =============================================================================
platform_config:
  pythia:
    enabled: true
    grid_resolution: 0.0833
    climate_source: nasa_power
    soil_source: eghr
    dssat_version: "4.8"

    # --- eGHR Soil Data ---
    # UPDATE THESE PATHS for your system
    eghr_raster_path: "data/eGHR/ggcmi_soils_2.tif"
    eghr_database_path: "data/eGHR/GHR.db"
    eghr_sol_dir: "data/eGHR/"

    # --- SPAM Crop Distribution ---
    spam_raster_dir: "data/spam/"
    spam_version: "2020"

    # --- DSSAT Crop Model Selection ---
    # These are auto-detected from crop name if not set.
    # Set explicitly for non-standard crops or to override auto-detection.
    # dssat_smodel: "MZCER"         # CERES-Maize (auto for cereals)
    # dssat_smodel: "CROPGRO"       # CROPGRO (auto for legumes: cowpea, soybean, etc.)
    # dssat_cultivar_ingeno: null    # DSSAT cultivar code (e.g., "II0003" for IT90K-277-2 cowpea)
    # dssat_cultivar_cname: null     # DSSAT cultivar name (e.g., "IT90K-277-2")
    # dssat_symbiosis: null          # Symbiotic N fixation (Y/N, auto: Y for legumes)

    dssat_cultivar_ingeno: "II0003"
    dssat_cultivar_cname: "IT90K-277-2"
    planting_window_days: 30

    # --- Weather Download ---
    weather_download_delay: 2.0
