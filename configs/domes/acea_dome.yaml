# ACEA Platform DOME (Data Overlay for Multi-model Export)
# Platform: ACEA (AquaCrop Earth Observation framework)
#
# DESIGN PRINCIPLE: This DOME contains ALL platform-specific settings explicitly.
#
# Usage: prismpy translate --base configs/base/X.yaml --dome configs/domes/acea_dome.yaml

dome_type: "platform_overlay"
platform: "acea"
description: "ACEA (AquaCrop Earth Observation) - Complete platform configuration"

# =============================================================================
# PLATFORM CONFIG (Complete - matches legacy format exactly)
# =============================================================================
platform_config:
  acea:
    enabled: true
    resolution: "30arcmin"
    climate_source: nasa_power
    soil_source: hwsd

    # --- HWSD Soil Data ---
    hwsd_bil_path: "data/hwsd/HWSD2.bil"
    hwsd_mdb_path: "data/hwsd/HWSD2.mdb"

    # --- SPAM Crop Mask ---
    spam_raster_path: "data/spam/spam2020_V2r0_global_H_RICE_A.tif"

    # --- Processing Settings ---
    compute_et0: true
    download_climate: true
    climate_download_delay: 2.0

    # --- GAEZ Crop Suitability Data ---
    gaez_auto_download: true

    # --- Soil fertility calibration (GAEZ-based) ---
    soil_fertility: 1

    # --- Rice irrigation (CS3: Kaly 2016) ---
    bunds: true
    bunds_dz: 0.3
    irr_thresholds: [0, 0, 0, 0]
    virtual_irrigation: "Highinput"

    # --- GDD overrides (Kaly 2016, Tbase=10, 18 deg-Cd/day) ---
    gdd_maturity: 2124
    gdd_senescence: 1854
