# AC-3 small-bbox E2E render — dependent-gating partial-tolerance proof.
# Sorghum · Nigeria (Kano state) · pythia — a SMALL bbox (~0.4°, ~16-25 cells) that is a
# SUBSET of the Demo-1 region (8.0-9.0E/11.0-12.0N) so weather+soil are already CACHED
# (fast generation, no live re-fetch). Proves n_response_skill renders 6 charts + coverage
# matrix on REAL data with the partial-tolerance fix, ZERO code change (same §7 generator).
project:
  name: "nrisk_demo_smallbbox_sorghum_nigeria"
  description: "AC-3 small-bbox PYTHIA Kano Nigeria Sorghum 2018-2020 (n_response_skill render)"
  version: "1.0"

# §7 field: modeler-supplied observed N-trials CSV (fail-closed copy into data/n_trials.csv).
n_trials_source_path: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/prismpy/nrisk_demo_smallbbox_trials.csv"

region:
  name: "KanoStateSmall"
  country: "Nigeria"
  country_iso3: "NGA"
  boundary:
    source: "manual"
    manual_bounds:
      minx: 8.0
      miny: 11.0
      maxx: 8.4
      maxy: 11.4

crop:
  name: "Sorghum"
  name_short: "SG"
  variety: "caudatum_guinea"
  calendar:
    planting_doy: 170
    maturity_doy: 290
  phenology:
    emergence_gdd: 80.0
    vegetative_phase_gdd: 420.0
    reproductive_phase_gdd: 350.0
    grain_filling_gdd: 450.0
    photoperiod_sensitivity: 0.2
  physiology:
    base_temperature: 8.0
    optimal_temperature: 30.0
    max_temperature: 42.0
    radiation_use_efficiency: 3.5
    harvest_index: 0.40

management:
  planting_density: 130000.0
  sowing_mode: "fixed_date"
  irrigation: false

soil_config:
  source: "eghr"
  default_depth_m: 1.5

temporal:
  start_year: 2018
  end_year: 2020
  spinup_years: 0

targets:
  - pythia

platform_config:
  pythia:
    enabled: true
    grid_resolution: 0.0833
    climate_source: nasa_power
    soil_source: eghr
    dssat_version: "4.8"
    eghr_raster_path: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/PYTHIA/Simulation_Data/raster/ggcmi_soils_2.tif"
    eghr_database_path: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/PYTHIA/Simulation_Data/eGHR/GHR.db"
    eghr_sol_dir: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/PYTHIA/Simulation_Data/eGHR/"
    weather_download_delay: 1.0
    spam_raster_dir: "/Users/francktonle/Downloads/DATA-TO-MODEL-TRANSLATION/data/spam/"
    spam_version: "2020"
    include_spam_in_package: true

data_sources:
  climate:
    source: "nasa_power"
  soil:
    source: "eghr"
  cache_enabled: true
  cache_dir: "data/cache/"

output:
  base_dir: "output/nrisk_demo_smallbbox_sorghum_nigeria/"
  structure: "by_platform"

provenance:
  enabled: true
  storage: "json"
